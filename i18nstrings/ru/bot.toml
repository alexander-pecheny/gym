# What the login bot says on its own.

[texts]
help = "Пришлите код со страницы входа, и я вас впущу."
down = "Сайт сейчас не отвечает. Попробуйте через минуту."

[register]
done = "Готово. Вернитесь на страницу, с которой начали, — вы вошли."
expired = "Код истёк. Откройте страницу входа заново."

[login]
hint = 'Откройте {{.url}} и нажмите «Войти через Telegram» — страница покажет код, который надо прислать мне.'
